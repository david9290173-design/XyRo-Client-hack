name: Build XyRo
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Unzip project
        run: unzip -q XyRo-Client-source.zip
      - name: Build
        working-directory: xyro-client
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XyRo-Client-jar
          path: xyro-client/build/libs/*.jar
